[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcd-roundtable"
version = "0.1.0"
description = "麦门圆桌 —— 多 AI 人格辩论式麦当劳点餐 Agent，基于麦当劳中国官方 MCP Server"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["mcp", "mcdonalds", "agent", "llm", "cli"]
dependencies = [
    "mcp>=1.2.0",
    "openai>=1.30.0",
    "rich>=13.0.0",
]

[project.scripts]
mcd-roundtable = "mcd_roundtable.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
